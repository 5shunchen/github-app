name: 📱 Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 📦 Create iOS Project
        run: |
          mkdir -p GitHubiOSApp
          cd GitHubiOSApp

          # 创建 AppDelegate
          cat > AppDelegate.swift << 'EOF'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = UINavigationController(rootViewController: ViewController())
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # 创建 ViewController - GitHub WebView
          cat > ViewController.swift << 'EOF'
          import UIKit
          import WebKit

          class ViewController: UIViewController, WKNavigationDelegate {
              var webView: WKWebView!
              var activityIndicator: UIActivityIndicatorView!
              
              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "GitHub iOS"
                  view.backgroundColor = .systemBackground
                  
                  setupWebView()
                  setupActivityIndicator()
                  loadGitHub()
              }
              
              func setupWebView() {
                  let config = WKWebViewConfiguration()
                  webView = WKWebView(frame: view.bounds, configuration: config)
                  webView.navigationDelegate = self
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  view.addSubview(webView)
              }
              
              func setupActivityIndicator() {
                  activityIndicator = UIActivityIndicatorView(style: .large)
                  activityIndicator.center = view.center
                  activityIndicator.hidesWhenStopped = true
                  view.addSubview(activityIndicator)
              }
              
              func loadGitHub() {
                  guard let url = URL(string: "https://github.com") else { return }
                  webView.load(URLRequest(url: url))
              }
              
              func webView(_ webView: WKWebView, didStartProvisionalNavigation navigation: WKNavigation!) {
                  activityIndicator.startAnimating()
              }
              
              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  activityIndicator.stopAnimating()
              }
              
              func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) {
                  activityIndicator.stopAnimating()
              }
          }
          EOF

          # 创建 Info.plist
          cat > Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>com.github.iosapp</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>GitHub iOS</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIApplicationSceneManifest</key>
              <dict/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          # 创建 Xcode 项目
          mkdir -p GitHubiOSApp.xcodeproj
          cat > GitHubiOSApp.xcodeproj/project.pbxproj << 'ENDOFFILE'
// !$*UTF8*$!
{
	archiveVersion = 1;
	classes = {};
	objectVersion = 56;
	objects = {
/* Begin PBXBuildFile section */
		AppDelegate.swift in Sources = {isa = PBXBuildFile; fileRef = AppDelegate.swift; };
		ViewController.swift in Sources = {isa = PBXBuildFile; fileRef = ViewController.swift; };
/* End PBXBuildFile section */
/* Begin PBXFileReference section */
		AppDelegate.swift = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; };
		Info.plist = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
		GitHubiOSApp.app = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = GitHubiOSApp.app; sourceTree = BUILT_PRODUCTS_DIR; };
		ViewController.swift = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ViewController.swift; sourceTree = "<group>"; };
/* End PBXFileReference section */
/* Begin PBXGroup section */
		GitHubiOSApp = {isa = PBXGroup; children = (AppDelegate.swift, ViewController.swift, Info.plist); path = GitHubiOSApp; sourceTree = "<group>"; };
/* End PBXGroup section */
/* Begin PBXNativeTarget section */
		GitHubiOSApp = {
			isa = PBXNativeTarget;
			buildConfigurationList = BuildConfigurationList;
			buildPhases = (SourcesBuildPhase);
			buildRules = ();
			dependencies = ();
			name = GitHubiOSApp;
			productName = GitHubiOSApp;
			productReference = GitHubiOSApp.app;
			productType = "com.apple.product-type.application";
		};
/* End PBXNativeTarget section */
/* Begin PBXProject section */
		Project = {
			isa = PBXProject;
			attributes = {LastUpgradeCheck = 1500; ORGANIZATIONNAME = ""; TargetAttributes = { GitHubiOSApp = {CreatedOnToolsVersion = 15.0; }; }; };
			buildConfigurationList = BuildConfigurationList;
			compatibilityVersion = "Xcode 15.0";
			developmentRegion = en;
			hasScannedForEncodings = 0;
			mainGroup = GitHubiOSApp;
			productRefGroup = GitHubiOSApp;
			projectDirPath = "";
			projectRoot = "";
			targets = (GitHubiOSApp);
		};
/* End PBXProject section */
/* Begin PBXSourcesBuildPhase section */
		SourcesBuildPhase = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (AppDelegate.swift in Sources, ViewController.swift in Sources); runOnlyForDeploymentPostprocessing = 0; };
/* End PBXSourcesBuildPhase section */
/* Begin XCBuildConfiguration section */
		Debug = {isa = XCBuildConfiguration; buildSettings = {
			ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
			CODE_SIGN_IDENTITY = "";
			CODE_SIGNING_REQUIRED = NO;
			CODE_SIGNING_ALLOWED = NO;
			CODE_SIGN_STYLE = Manual;
			CURRENT_PROJECT_VERSION = 1;
			DEVELOPMENT_TEAM = "";
			IPHONEOS_DEPLOYMENT_TARGET = 16.0;
			MARKETING_VERSION = 1.0.0;
			PRODUCT_BUNDLE_IDENTIFIER = "com.github.iosapp";
			PRODUCT_NAME = GitHubiOSApp;
			SWIFT_VERSION = 5.0;
			TARGETED_DEVICE_FAMILY = "1,2";
		}; name = Debug; };
		Release = {isa = XCBuildConfiguration; buildSettings = {
			ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
			CODE_SIGN_IDENTITY = "";
			CODE_SIGNING_REQUIRED = NO;
			CODE_SIGNING_ALLOWED = NO;
			CODE_SIGN_STYLE = Manual;
			CURRENT_PROJECT_VERSION = 1;
			DEVELOPMENT_TEAM = "";
			IPHONEOS_DEPLOYMENT_TARGET = 16.0;
			MARKETING_VERSION = 1.0.0;
			PRODUCT_BUNDLE_IDENTIFIER = "com.github.iosapp";
			PRODUCT_NAME = GitHubiOSApp;
			SWIFT_VERSION = 5.0;
			TARGETED_DEVICE_FAMILY = "1,2";
		}; name = Release; };
/* End XCBuildConfiguration section */
/* Begin XCConfigurationList section */
		BuildConfigurationList = {isa = XCConfigurationList; buildConfigurations = (Debug, Release); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
/* End XCConfigurationList section */
	};
	rootObject = Project;
}
ENDOFFILE

      - name: 🔨 Build iOS App
        run: |
          cd GitHubiOSApp
          xcodebuild archive \
            -project GitHubiOSApp.xcodeproj \
            -scheme GitHubiOSApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/GitHubiOSApp.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: 📦 Create IPA
        run: |
          cd GitHubiOSApp
          mkdir -p build/Payload
          cp -R "build/GitHubiOSApp.xcarchive/Products/Applications/GitHubiOSApp.app" build/Payload/
          cd build
          zip -qr "GitHub-iOS-App-v1.0.0.ipa" Payload/
          ls -lh "GitHub-iOS-App-v1.0.0.ipa"

      - name: 📤 Upload IPA to Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: v1.0.0
          name: GitHub iOS App v1.0.0
          files: GitHubiOSApp/build/GitHub-iOS-App-v1.0.0.ipa
          draft: false
          append_body: true
          body: |
            # 📱 GitHub iOS App v1.0.0 - 可直接安装
            
            ## 下载安装
            
            **下载文件：** `GitHub-iOS-App-v1.0.0.ipa`
            
            ## 安装方式
            
            ### 方式1：Sideloadly（推荐 ✅）
            1. 下载 Sideloadly：https://sideloadly.io/
            2. 打开 Sideloadly
            3. 把 IPA 文件拖进去
            4. 选择你的 iPhone/iPad
            5. 点击 Start
            6. 手机上信任开发者
            
            ### 方式2：AltStore
            1. 安装 AltStore：https://altstore.io/
            2. 在 My Apps 标签点击 +
            3. 选择 IPA 文件
            
            ### 方式3：Xcode
            1. Xcode → Window → Devices and Simulators
            2. 选择设备
            3. 点击 + 添加 IPA
            
            ## 系统要求
            - iOS 16.0 或更高版本
            - 支持 iPhone 和 iPad
            
            ## 功能
            - ✅ 完整 GitHub 网页访问
            - ✅ 内置浏览器
            - ✅ 加载指示器
