name: 📱 Build iOS IPA - Guaranteed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🚀 30秒生成 IPA - 最简单最可靠方式
        run: |
          echo "📝 创建 Swift 源文件..."
          cat > main.swift << 'EOF'
import UIKit

@main class AppDelegate: UIResponder, UIApplicationDelegate {
    var window: UIWindow?
    func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
        window = UIWindow(frame: UIScreen.main.bounds)
        let vc = UIViewController()
        vc.view.backgroundColor = .systemBackground
        let label = UILabel(frame: CGRect(x: 0, y: 150, width: UIScreen.main.bounds.width, height: 60))
        label.text = "🎉 GitHub iOS App"
        label.font = UIFont.boldSystemFont(ofSize: 28)
        label.textAlignment = .center
        label.textColor = .label
        vc.view.addSubview(label)
        let subLabel = UILabel(frame: CGRect(x: 0, y: 220, width: UIScreen.main.bounds.width, height: 40))
        subLabel.text = "v1.0.0 安装成功！"
        subLabel.font = UIFont.systemFont(ofSize: 18)
        subLabel.textAlignment = .center
        subLabel.textColor = .secondaryLabel
        vc.view.addSubview(subLabel)
        window?.rootViewController = vc
        window?.makeKeyAndVisible()
        return true
    }
}
EOF

          echo "📝 创建 Info.plist..."
          cat > Info.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key><string>App</string>
    <key>CFBundleIdentifier</key><string>com.github.iosapp</string>
    <key>CFBundleName</key><string>GitHub iOS</string>
    <key>CFBundlePackageType</key><string>APPL</string>
    <key>CFBundleShortVersionString</key><string>1.0.0</string>
    <key>CFBundleVersion</key><string>1</string>
    <key>LSRequiresIPhoneOS</key><true/>
    <key>MinimumOSVersion</key><string>16.0</string>
    <key>UILaunchScreen</key><dict/>
</dict>
</plist>
EOF

          echo "🔨 编译 arm64 iOS 可执行文件..."
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -target arm64-apple-ios16.0 \
            -emit-executable -o App main.swift
          echo "✅ 编译完成！"

          echo "📦 打包 IPA..."
          mkdir -p Payload/App.app
          cp App Payload/App.app/
          cp Info.plist Payload/App.app/
          zip -qr GitHub-iOS-App-v1.0.0.ipa Payload/

          ls -lh GitHub-iOS-App-v1.0.0.ipa
          echo "✅ IPA 生成成功！大小: $(du -h GitHub-iOS-App-v1.0.0.ipa | cut -f1)"

      - name: 📤 上传到 GitHub Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: v1.0.0
          name: GitHub iOS App v1.0.0
          files: GitHub-iOS-App-v1.0.0.ipa
          fail_on_unmatched_files: true
          append_body: true
          body: |
            # 🎉 GitHub iOS App v1.0.0 - 可直接安装
            
            ## 📱 下载文件
            
            **直接下载：** `GitHub-iOS-App-v1.0.0.ipa`
            
            ## 🚀 安装方式（30秒完成）
            
            ### 推荐：Sideloadly（免费，无需开发者账号）
            1. **下载 Sideloadly**：https://sideloadly.io/
            2. **打开 Sideloadly**
            3. **把 IPA 文件拖进去**
            4. **选择你的 iPhone/iPad**
            5. **点击 Start**
            6. **手机上信任开发者**：设置 → 通用 → VPN与设备管理 → 信任
            
            ## ✅ 系统要求
            - iOS 16.0 或更高版本
            - 支持 iPhone 和 iPad
